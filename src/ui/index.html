<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>likzik dashboard</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #1c2330; --muted: #5d6778; --line: #e3e6eb;
  --accent: #2f6fde; --accent-ink: #ffffff; --ok: #1f8a4c; --warn: #b7791f; --err: #c53030;
  --chip: #eef2f8; --code: #f1f3f6; --shadow: 0 1px 2px rgba(16,24,40,.06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1218; --panel: #171b23; --ink: #e6e9ef; --muted: #98a2b3; --line: #262c37;
    --accent: #5b8def; --accent-ink: #0f1218; --ok: #48bb78; --warn: #ecc94b; --err: #f56565;
    --chip: #222937; --code: #11151c; --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1218; --panel: #171b23; --ink: #e6e9ef; --muted: #98a2b3; --line: #262c37;
  --accent: #5b8def; --accent-ink: #0f1218; --ok: #48bb78; --warn: #ecc94b; --err: #f56565;
  --chip: #222937; --code: #11151c; --shadow: none;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
code, pre, textarea { font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
a { color: var(--accent); }
.layout { display: grid; grid-template-columns: 210px 1fr; min-height: 100vh; }
nav { background: var(--panel); border-right: 1px solid var(--line); padding: 16px 10px; position: sticky; top: 0; height: 100vh; }
.brand { font-weight: 700; font-size: 17px; padding: 4px 10px 14px; display: flex; align-items: center; gap: 8px; }
.brand .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
.brand .dot.live { background: var(--ok); }
.brand .dot.down { background: var(--err); }
nav button { display: flex; justify-content: space-between; width: 100%; text-align: left; border: 0; background: none; color: var(--ink); padding: 8px 10px; border-radius: 6px; cursor: pointer; font: inherit; }
nav button:hover { background: var(--chip); }
nav button.active { background: var(--accent); color: var(--accent-ink); }
nav .count { opacity: .75; font-size: 12px; }
nav .foot { position: absolute; bottom: 14px; left: 10px; right: 10px; color: var(--muted); font-size: 12px; padding: 0 10px; }
main { padding: 20px 28px 80px; min-width: 0; }
h1 { font-size: 20px; margin: 0 0 4px; }
.sub { color: var(--muted); margin: 0 0 18px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; margin-bottom: 18px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; box-shadow: var(--shadow); }
.card .k { color: var(--muted); font-size: 12px; }
.card .v { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; }
.card .v small { font-size: 12px; font-weight: 500; color: var(--muted); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); margin-bottom: 18px; }
.panel h2 { font-size: 14px; margin: 0; padding: 12px 14px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
input[type=search], input[type=password], input[type=text] { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; font: inherit; min-width: 240px; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; }
tr:last-child td { border-bottom: 0; }
tbody tr:hover { background: color-mix(in srgb, var(--chip) 60%, transparent); }
.chip { display: inline-block; background: var(--chip); border-radius: 999px; padding: 1px 8px; font-size: 12px; margin: 1px 3px 1px 0; white-space: nowrap; }
.chip.ok { color: var(--ok); } .chip.warn { color: var(--warn); } .chip.err { color: var(--err); }
.status { width: 9px; height: 9px; border-radius: 50%; display: inline-block; background: var(--ok); }
.status.err { background: var(--err); } .status.warn { background: var(--warn); }
.muted { color: var(--muted); }
.btn { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 6px; padding: 6px 11px; cursor: pointer; font: inherit; font-size: 13px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--err); }
.btn.small { padding: 2px 8px; font-size: 12px; }
.row-actions { white-space: nowrap; text-align: right; }
.banner { position: fixed; left: 210px; right: 0; bottom: 0; background: var(--panel); border-top: 2px solid var(--warn); padding: 10px 28px; display: none; align-items: center; gap: 12px; z-index: 5; }
.banner.show { display: flex; }
.banner .grow { flex: 1; }
.msg { border-radius: 6px; padding: 9px 12px; margin: 10px 0; white-space: pre-wrap; font-size: 13px; }
.msg.ok { background: color-mix(in srgb, var(--ok) 14%, transparent); }
.msg.err { background: color-mix(in srgb, var(--err) 14%, transparent); }
.editor { width: 100%; min-height: 60vh; background: var(--code); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 12px; resize: vertical; tab-size: 2; }
dialog { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--ink); width: min(760px, 94vw); padding: 0; }
dialog::backdrop { background: rgba(0,0,0,.45); }
dialog header { padding: 12px 16px; border-bottom: 1px solid var(--line); font-weight: 650; }
dialog .body { padding: 14px 16px; }
dialog footer { padding: 12px 16px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; }
dialog textarea { min-height: 42vh; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.kv { display: grid; grid-template-columns: 160px 1fr; gap: 6px 12px; padding: 12px 14px; }
.kv div:nth-child(odd) { color: var(--muted); }
.empty { padding: 18px 14px; color: var(--muted); }
.spark { width: 100%; height: 60px; display: block; }
@media (max-width: 820px) {
  .layout { grid-template-columns: 1fr; }
  nav { position: static; height: auto; display: flex; flex-wrap: wrap; gap: 4px; }
  nav button { width: auto; } nav .foot { display: none; }
  .banner { left: 0; } .grid2 { grid-template-columns: 1fr; } main { padding: 16px; }
}
</style>
</head>
<body>
<div class="layout">
  <nav>
    <div class="brand"><span class="dot" id="live-dot"></span>likzik</div>
    <button data-view="overview" class="active">Overview</button>
    <button data-view="routers">HTTP Routers <span class="count" id="n-routers"></span></button>
    <button data-view="services">Services <span class="count" id="n-services"></span></button>
    <button data-view="middlewares">Middlewares <span class="count" id="n-middlewares"></span></button>
    <button data-view="entrypoints">Entrypoints <span class="count" id="n-entrypoints"></span></button>
    <button data-view="config">Config</button>
    <div class="foot"><div id="foot-gen"></div><div id="foot-path" style="word-break:break-all"></div>
      <button class="btn small" id="theme" style="margin-top:8px">Theme</button></div>
  </nav>
  <main id="main"></main>
</div>
<div class="banner" id="banner">
  <span class="chip warn" id="banner-count"></span>
  <span class="grow">Unsaved changes. They are validated by the proxy before anything is written.</span>
  <button class="btn" id="discard">Discard</button>
  <button class="btn" id="review">Review JSON</button>
  <button class="btn primary" id="apply">Validate &amp; apply</button>
</div>
<dialog id="dlg">
  <header id="dlg-title"></header>
  <div class="body"><div id="dlg-help" class="muted" style="margin-bottom:8px"></div>
    <textarea class="editor" id="dlg-text" spellcheck="false"></textarea><div id="dlg-msg"></div></div>
  <footer><button class="btn danger" id="dlg-delete">Delete</button><span style="flex:1"></span>
    <button class="btn" id="dlg-cancel">Cancel</button><button class="btn primary" id="dlg-save">Save to draft</button></footer>
</dialog>
<dialog id="login">
  <header>Access token</header>
  <div class="body"><p class="muted">This dashboard was started with <code>--token</code>.</p>
    <input type="password" id="login-token" placeholder="token" style="width:100%"></div>
  <footer><button class="btn primary" id="login-ok">Continue</button></footer>
</dialog>
<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const state = { view: "overview", loaded: null, etag: null, draft: null, dirty: 0, info: {}, server: null,
  stats: null, prevStats: null, prevAt: 0, rps: [], metrics: {}, adminUp: null, filter: "" };

// ---------------------------------------------------------------- API
function token() { try { return sessionStorage.getItem("likzik-token") || ""; } catch { return ""; } }
async function api(path, opts = {}) {
  const headers = Object.assign({}, opts.headers || {});
  if (token()) headers["Authorization"] = "Bearer " + token();
  const r = await fetch(path, Object.assign({}, opts, { headers }));
  if (r.status === 401) { await askToken(); return api(path, opts); }
  return r;
}
function askToken() {
  return new Promise(res => {
    const d = $("#login"); d.showModal();
    $("#login-ok").onclick = () => { try { sessionStorage.setItem("likzik-token", $("#login-token").value); } catch {} d.close(); res(); };
  });
}
async function loadConfig() {
  const r = await api("/api/config");
  const j = await r.json();
  if (!r.ok) { state.loadError = j.error || "cannot load config"; return; }
  state.loaded = JSON.parse(j.text); state.etag = j.etag; state.path = j.path;
  state.draft = structuredClone(state.loaded); state.dirty = 0; state.loadError = null;
}
async function poll() {
  try {
    const [si, st, me] = await Promise.all([api("/api/admin/server_info"), api("/api/admin/stats"), api("/api/admin/metrics")]);
    if (!si.ok) throw new Error("admin");
    state.server = await si.json();
    const stats = Object.fromEntries((await st.text()).trim().split("\n").map(l => { const [k, v] = l.split(": "); return [k, Number(v)]; }));
    const now = performance.now();
    if (state.stats) {
      const dt = (now - state.prevAt) / 1000;
      const rps = Math.max(0, (stats.downstream_rq_total - state.stats.downstream_rq_total) / dt);
      state.rps.push(rps); if (state.rps.length > 60) state.rps.shift();
      state.rate = { rps, tcp: Math.max(0, (stats.tcp_cx_total - state.stats.tcp_cx_total) / dt),
        e5: Math.max(0, (stats.downstream_rq_5xx - state.stats.downstream_rq_5xx) / dt) };
    }
    state.stats = stats; state.prevAt = now;
    state.metrics = {};
    for (const l of (await me.text()).split("\n")) {
      const m = l.match(/^likzik_gateway_(\w+)_total (\d+)/); if (m) state.metrics[m[1]] = Number(m[2]);
    }
    state.adminUp = true;
  } catch { state.adminUp = false; }
  $("#live-dot").className = "dot " + (state.adminUp ? "live" : state.adminUp === false ? "down" : "");
  $("#foot-gen").textContent = state.server ? `generation ${state.server.config.generation}` : (state.adminUp === false ? "admin unreachable" : "");
  if (state.view === "overview") render();
}

// ---------------------------------------------------------------- model
const gw = c => (c.extensions && c.extensions.gateway) || null;
function routers(c) {
  const out = [];
  const g = gw(c);
  if (g) (g.routes || []).forEach((r, i) => out.push({ kind: "gateway", name: r.name, rule: ruleOf(r), r, target: targetOf(r),
    mw: [...(r.auth || []).map(a => "auth:" + a), ...(r.rate_limits || []).map(a => "limit:" + a)],
    entry: (g.listeners || (c.listeners || []).filter(l => (l.protocol || "http") === "http").map(l => l.name)).join(", "),
    ref: ["extensions", "gateway", "routes", i] }));
  (c.route_configs || []).forEach((rc, ri) => (rc.virtual_hosts || []).forEach((vh, vi) => (vh.routes || []).forEach((r, k) => {
    const m = r.match || {};
    const eps = (c.listeners || []).filter(l => l.route_config === rc.name).map(l => l.name);
    out.push({ kind: "core", name: `${rc.name}/${vh.name}#${k + 1}`, r,
      rule: [`Host(${(vh.domains || []).join(", ")})`, m.prefix ? `PathPrefix(${m.prefix})` : `Path(${m.path})`, m.methods ? `Method(${m.methods.join(",")})` : ""].filter(Boolean).join(" && "),
      target: { type: "service", value: r.route && r.route.cluster }, mw: r.route && r.route.prefix_rewrite ? ["rewrite"] : [],
      entry: eps.join(", "), ref: ["route_configs", ri, "virtual_hosts", vi, "routes", k] });
  })));
  (c.listeners || []).forEach((l, i) => { if (l.protocol === "tcp") out.push({ kind: "tcp", name: l.name, rule: `TCP(${l.address})`, r: l,
    target: { type: "service", value: l.cluster }, mw: [], entry: l.name, ref: ["listeners", i] }); });
  return out;
}
function ruleOf(r) {
  const p = [];
  if (r.hosts && r.hosts.length) p.push(`Host(${r.hosts.join(", ")})`);
  p.push(`Path(${r.path})`);
  if (r.methods && r.methods.length) p.push(`Method(${r.methods.join(",")})`);
  for (const h of r.headers || []) p.push(`Header(${h.name}${h.value ? "=" + h.value : h.prefix ? "^=" + h.prefix : ""})`);
  for (const q of r.query || []) p.push(`Query(${q.name}${q.value ? "=" + q.value : ""})`);
  return p.join(" && ");
}
function targetOf(r) {
  if (r.cluster) return { type: "service", value: r.cluster, extra: r.rewrite ? "→ " + r.rewrite : "" };
  if (r.redirect) return { type: "redirect", value: `${r.redirect.status || 302} ${r.redirect.location}` };
  if (r.respond) return { type: "respond", value: String(r.respond.status || 200) };
  return { type: "?", value: "" };
}
function problems(c, rt) {
  const issues = [];
  const clusters = new Set((c.clusters || []).map(x => x.name));
  if (rt.target.type === "service" && rt.target.value && !clusters.has(rt.target.value)) issues.push(`unknown service '${rt.target.value}'`);
  const g = gw(c);
  if (rt.kind === "gateway" && g) {
    const auth = new Set([...(g.api_keys || []).map(a => a.name), ...(g.jwt || []).map(a => a.name)]);
    const lim = new Set((g.rate_limits || []).map(a => a.name));
    for (const a of rt.r.auth || []) if (!auth.has(a)) issues.push(`unknown auth '${a}'`);
    for (const a of rt.r.rate_limits || []) if (!lim.has(a)) issues.push(`unknown rate limit '${a}'`);
  }
  return issues;
}
function middlewares(c) {
  const g = gw(c); if (!g) return [];
  const out = [];
  (g.api_keys || []).forEach((a, i) => out.push({ type: "API key", name: a.name, ref: ["extensions", "gateway", "api_keys", i],
    detail: `${a.keys ? a.keys.length : 0} keys · header ${a.header || "X-API-Key"}${a.query ? " · query " + a.query : ""}`,
    consumers: (a.keys || []).map(k => k.consumer) }));
  (g.jwt || []).forEach((a, i) => out.push({ type: "JWT", name: a.name, ref: ["extensions", "gateway", "jwt", i],
    detail: `${(a.algorithms || []).join(", ")}${a.issuer ? " · iss " + a.issuer : ""}${a.audiences && a.audiences.length ? " · aud " + a.audiences.join(",") : ""}${a.jwks_file ? " · " + a.jwks_file : ""}${a.hs_secret ? " · HMAC secret set" : ""}` }));
  (g.rate_limits || []).forEach((a, i) => out.push({ type: "Rate limit", name: a.name, ref: ["extensions", "gateway", "rate_limits", i],
    detail: `${a.requests} / ${a.per || "second"} · burst ${a.burst ?? a.requests} · key ${a.key || "client_ip"}` }));
  return out;
}
function usedBy(c, name) {
  return routers(c).filter(r => (r.r.auth || []).includes(name) || (r.r.rate_limits || []).includes(name)).map(r => r.name);
}
const getIn = (o, ref) => ref.reduce((x, k) => x == null ? x : x[k], o);
function setIn(o, ref, v) { const p = getIn(o, ref.slice(0, -1)); p[ref[ref.length - 1]] = v; }
function delIn(o, ref) { const p = getIn(o, ref.slice(0, -1)); p.splice(ref[ref.length - 1], 1); }
function ensure(o, path, init) { let x = o; path.forEach((k, i) => { if (x[k] == null) x[k] = i === path.length - 1 ? init : {}; x = x[k]; }); return x; }

// ---------------------------------------------------------------- views
const fmt = n => n == null ? "–" : n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e4 ? (n / 1e3).toFixed(1) + "k" : Math.round(n).toLocaleString();
const card = (k, v, small = "") => `<div class="card"><div class="k">${esc(k)}</div><div class="v">${v}${small ? ` <small>${esc(small)}</small>` : ""}</div></div>`;
function spark(vals) {
  if (vals.length < 2) return `<div class="empty">collecting…</div>`;
  const w = 600, h = 60, max = Math.max(1, ...vals);
  const pts = vals.map((v, i) => `${(i / (vals.length - 1)) * w},${h - 4 - (v / max) * (h - 8)}`).join(" ");
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="requests per second">
    <polyline fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke" points="${pts}"/></svg>`;
}
function vOverview() {
  const s = state.stats || {}, si = state.server, c = state.draft || {}, m = state.metrics, rate = state.rate || {};
  const rts = routers(c), bad = rts.filter(r => problems(c, r).length).length;
  let h = `<h1>Overview</h1><p class="sub">${si ? `${esc(si.state)} · ${si.workers} workers · up ${Math.round(si.uptime_ms / 60000)} min · build ${esc(si.build)}` : state.adminUp === false ? "The proxy's admin endpoint is unreachable: status below is unavailable, config editing still works." : "connecting…"}</p>`;
  if (si && si.config.last_error) h += `<div class="msg err"><b>Last reload rejected:</b> ${esc(si.config.last_error)}</div>`;
  h += `<div class="cards">${card("Requests / s", fmt(rate.rps))}${card("Active connections", fmt((s.downstream_cx_active || 0) + (s.tcp_cx_active || 0)))}
    ${card("Requests", fmt(s.downstream_rq_total))}${card("5xx", fmt(s.downstream_rq_5xx), rate.e5 ? fmt(rate.e5) + "/s" : "")}
    ${card("Upstream conns", fmt(s.upstream_cx_active), `idle ${fmt(s.upstream_cx_idle)}`)}${card("Pool hit", s.upstream_rq_total ? Math.round(100 * (s.upstream_cx_pool_hit || 0) / s.upstream_rq_total) + "%" : "–")}
    ${card("Config", si ? "gen " + si.config.generation : "–", si && si.config.version ? si.config.version : "")}
    ${card("Reloads", fmt(si ? si.config.reloads_ok : null), si && si.config.reloads_failed ? si.config.reloads_failed + " rejected" : "")}</div>`;
  h += `<div class="panel"><h2>Requests per second <span class="muted">now ${fmt(rate.rps)} · peak ${fmt(state.rps.length ? Math.max(...state.rps) : null)} · last 2 min</span></h2><div style="padding:10px 14px">${spark(state.rps)}</div></div>`;
  h += `<div class="grid2"><div class="panel"><h2>Responses</h2><div class="kv">
    <div>2xx</div><div>${fmt(s.downstream_rq_2xx)}</div><div>3xx</div><div>${fmt(s.downstream_rq_3xx)}</div>
    <div>4xx</div><div>${fmt(s.downstream_rq_4xx)}</div><div>5xx</div><div>${fmt(s.downstream_rq_5xx)}</div>
    <div>No route</div><div>${fmt(s.downstream_rq_no_route)}</div><div>Timeouts</div><div>${fmt(s.upstream_rq_timeout)}</div>
    <div>Connect failures</div><div>${fmt(s.upstream_cx_connect_fail)}</div><div>Ejections</div><div>${fmt(s.endpoint_ejections)}</div></div></div>
    <div class="panel"><h2>Gateway &amp; TLS</h2><div class="kv">
    <div>Auth missing</div><div>${fmt(m.auth_missing)}</div><div>Auth failed</div><div>${fmt(m.auth_failed)}</div>
    <div>Rate limited</div><div>${fmt(m.rate_limited)}</div><div>JWT cache</div><div>${m.jwt_cache_hits != null ? fmt(m.jwt_cache_hits) + " hits / " + fmt(m.jwt_cache_misses) + " misses" : "–"}</div>
    <div>TLS handshakes</div><div>${fmt(s.tls_handshakes)}</div><div>kTLS / userspace</div><div>${fmt(s.tls_ktls)} / ${fmt(s.tls_userspace)}</div>
    <div>Routers</div><div>${rts.length}${bad ? ` <span class="chip err">${bad} with errors</span>` : ""}</div><div>TCP bytes</div><div>${fmt(s.tcp_bytes)}</div></div></div></div>`;
  return h;
}
function filtered(list, keys) {
  const f = state.filter.toLowerCase(); if (!f) return list;
  return list.filter(x => keys(x).join(" ").toLowerCase().includes(f));
}
function toolbar(addLabel, addAction) {
  return `<div class="toolbar"><input type="search" id="filter" placeholder="Search…" value="${esc(state.filter)}">
    ${addLabel ? `<button class="btn primary" data-add="${addAction}">${addLabel}</button>` : ""}</div>`;
}
function vRouters() {
  const c = state.draft, list = filtered(routers(c), r => [r.name, r.rule, r.target.value, r.entry, ...r.mw]);
  let h = `<h1>HTTP Routers</h1><p class="sub">Gateway routes are matched first (by path priority, then order); core routes from <code>route_configs</code> serve listeners outside the gateway or when nothing matches with <code>fallthrough</code>.</p>`;
  h += toolbar(gw(c) ? "+ Add gateway route" : "+ Add core route", gw(c) ? "gw-route" : "core-route");
  h += `<div class="panel"><table><thead><tr><th></th><th>Rule</th><th>Name</th><th>Entrypoints</th><th>Middlewares</th><th>Target</th><th></th></tr></thead><tbody>`;
  for (const r of list) {
    const pr = problems(c, r);
    h += `<tr><td><span class="status ${pr.length ? "err" : ""}" title="${esc(pr.join("; ") || "ok")}"></span></td>
      <td><code>${esc(r.rule)}</code>${pr.length ? `<div class="chip err">${esc(pr.join("; "))}</div>` : ""}</td>
      <td>${esc(r.name)} <span class="chip">${r.kind}</span></td><td>${esc(r.entry) || '<span class="muted">none</span>'}</td>
      <td>${r.mw.map(x => `<span class="chip">${esc(x)}</span>`).join("") || '<span class="muted">–</span>'}</td>
      <td><span class="chip ${r.target.type === "service" ? "ok" : ""}">${r.target.type}</span> ${esc(r.target.value)} <span class="muted">${esc(r.target.extra || "")}</span></td>
      <td class="row-actions"><button class="btn small" data-edit='${JSON.stringify(r.ref)}' data-title="${esc(r.kind === "tcp" ? "Entrypoint " + r.name : "Router " + r.name)}">Edit</button></td></tr>`;
  }
  if (!list.length) h += `<tr><td colspan="7" class="empty">No routers${state.filter ? " match" : ""}.</td></tr>`;
  return h + `</tbody></table></div>`;
}
function vServices() {
  const c = state.draft, list = filtered((c.clusters || []).map((x, i) => ({ x, i })), o => [o.x.name, ...(o.x.endpoints || []).map(e => e.address)]);
  const used = name => routers(c).filter(r => r.target.value === name).length;
  let h = `<h1>Services</h1><p class="sub">Upstream clusters: load balancing, health ejection, connection pooling and upstream TLS.</p>${toolbar("+ Add service", "cluster")}`;
  h += `<div class="panel"><table><thead><tr><th>Name</th><th>Servers</th><th>Load balancer</th><th>TLS</th><th>Used by</th><th></th></tr></thead><tbody>`;
  for (const { x, i } of list) {
    h += `<tr><td><b>${esc(x.name)}</b></td><td>${(x.endpoints || []).map(e => `<span class="chip">${esc(e.address)}${e.weight && e.weight !== 1 ? " ×" + e.weight : ""}</span>`).join("")}</td>
      <td>${esc(x.lb_policy || "least_request")} <span class="muted">· connect ${x.connect_timeout_ms ?? 2000} ms · ${x.max_connect_attempts ?? 2} attempts</span></td>
      <td>${x.tls ? `<span class="chip ok">${esc(x.tls.sni || "tls")}${x.tls.verify === false ? " (no verify)" : ""}</span>` : '<span class="muted">–</span>'}</td>
      <td>${used(x.name) || '<span class="chip warn">unused</span>'}</td>
      <td class="row-actions"><button class="btn small" data-edit='${JSON.stringify(["clusters", i])}' data-title="Service ${esc(x.name)}">Edit</button></td></tr>`;
  }
  if (!list.length) h += `<tr><td colspan="6" class="empty">No services.</td></tr>`;
  return h + `</tbody></table></div>`;
}
function vMiddlewares() {
  const c = state.draft;
  let h = `<h1>Middlewares</h1><p class="sub">Gateway authentication and rate limits, referenced by name from routes. Keys and secrets are not shown here.</p>`;
  if (!gw(c)) return h + `<div class="panel"><div class="empty">This config has no <code>extensions.gateway</code> section, so there are no middlewares. Run the proxy as <code>likzik-gw</code> and add one from the Config tab, or <button class="btn small" data-add="gateway">create a gateway section</button>.</div></div>`;
  h += `<div class="toolbar"><input type="search" id="filter" placeholder="Search…" value="${esc(state.filter)}">
    <button class="btn" data-add="apikey">+ API keys</button><button class="btn" data-add="jwt">+ JWT</button><button class="btn" data-add="limit">+ Rate limit</button></div>`;
  const list = filtered(middlewares(c), m => [m.type, m.name, m.detail]);
  h += `<div class="panel"><table><thead><tr><th>Type</th><th>Name</th><th>Settings</th><th>Used by</th><th></th></tr></thead><tbody>`;
  for (const m of list) {
    const u = usedBy(c, m.name);
    h += `<tr><td><span class="chip">${esc(m.type)}</span></td><td><b>${esc(m.name)}</b></td>
      <td>${esc(m.detail)}${m.consumers ? `<div>${m.consumers.map(x => `<span class="chip">${esc(x)}</span>`).join("")}</div>` : ""}</td>
      <td>${u.length ? u.map(x => `<span class="chip">${esc(x)}</span>`).join("") : '<span class="chip warn">unused</span>'}</td>
      <td class="row-actions"><button class="btn small" data-edit='${JSON.stringify(m.ref)}' data-title="${esc(m.type)} ${esc(m.name)}">Edit</button></td></tr>`;
  }
  if (!list.length) h += `<tr><td colspan="5" class="empty">No middlewares.</td></tr>`;
  return h + `</tbody></table></div>`;
}
function vEntrypoints() {
  const c = state.draft, g = gw(c);
  let h = `<h1>Entrypoints</h1><p class="sub">Listeners. Address and protocol changes rebind sockets on reload; in-flight requests on removed listeners finish first.</p>${toolbar("+ Add entrypoint", "listener")}`;
  h += `<div class="panel"><table><thead><tr><th>Name</th><th>Address</th><th>Protocol</th><th>TLS</th><th>Routing</th><th></th></tr></thead><tbody>`;
  (c.listeners || []).forEach((l, i) => {
    const gwOn = g && (!g.listeners || g.listeners.includes(l.name)) && (l.protocol || "http") === "http";
    h += `<tr><td><b>${esc(l.name)}</b></td><td><code>${esc(l.address)}</code></td><td><span class="chip">${esc(l.protocol || "http")}</span></td>
      <td>${l.tls ? `<span class="chip ok">${l.tls.certificates.length} cert${l.tls.certificates.length > 1 ? "s" : ""}</span>` : '<span class="muted">–</span>'}</td>
      <td>${l.protocol === "tcp" ? "→ " + esc(l.cluster) : `${gwOn ? '<span class="chip ok">gateway</span>' : ""}<span class="chip">${esc(l.route_config)}</span>`}</td>
      <td class="row-actions"><button class="btn small" data-edit='${JSON.stringify(["listeners", i])}' data-title="Entrypoint ${esc(l.name)}">Edit</button></td></tr>`;
  });
  h += `</tbody></table></div>`;
  h += `<div class="panel"><h2>Global settings</h2><div class="kv"><div>Workers</div><div>${c.workers || "one per CPU"}</div>
    <div>Admin</div><div>${esc(c.admin ? c.admin.address : "disabled")}</div><div>Kernel TLS</div><div>${c.tls && c.tls.require_ktls === false ? "optional (userspace fallback allowed)" : "required"}</div>
    <div>Limits</div><div>${esc(JSON.stringify(c.limits || {}))}</div></div>
    <div style="padding:0 14px 12px"><button class="btn small" data-edit='["limits"]' data-title="Limits">Edit limits</button></div></div>`;
  return h;
}
function vConfig() {
  return `<h1>Config</h1><p class="sub">The whole file, including the pending draft. Validation runs the proxy's own <code>--check</code>; applying writes the file atomically (previous version saved as <code>.bak</code>) and the proxy reloads it.</p>
    <div class="toolbar"><button class="btn" id="cfg-validate">Validate</button><button class="btn primary" id="cfg-apply">Apply</button>
    <button class="btn" id="cfg-reload">Reload from disk</button><span class="muted">${esc(state.path || "")}</span></div>
    <div id="cfg-msg"></div><textarea class="editor" id="cfg-text" spellcheck="false">${esc(JSON.stringify(state.draft, null, 2))}</textarea>`;
}

// ---------------------------------------------------------------- render / events
function render() {
  const main = $("#main");
  if (state.loadError) { main.innerHTML = `<div class="msg err">${esc(state.loadError)}</div>`; return; }
  if (!state.draft) { main.innerHTML = `<p class="muted">Loading…</p>`; return; }
  const focus = document.activeElement && document.activeElement.id;
  const caret = focus === "filter" ? document.activeElement.selectionStart : null;
  if (state.view === "config" && $("#cfg-text")) return; // never clobber the editor
  main.innerHTML = { overview: vOverview, routers: vRouters, services: vServices, middlewares: vMiddlewares, entrypoints: vEntrypoints, config: vConfig }[state.view]();
  if (focus === "filter" && $("#filter")) { $("#filter").focus(); $("#filter").setSelectionRange(caret, caret); }
  const c = state.draft;
  $("#n-routers").textContent = routers(c).length; $("#n-services").textContent = (c.clusters || []).length;
  $("#n-middlewares").textContent = middlewares(c).length || ""; $("#n-entrypoints").textContent = (c.listeners || []).length;
  $("#foot-path").textContent = state.path || "";
  $("#banner").classList.toggle("show", state.dirty > 0);
  $("#banner-count").textContent = state.dirty + " change" + (state.dirty === 1 ? "" : "s");
}
document.querySelectorAll("nav button[data-view]").forEach(b => b.onclick = () => {
  if (state.view === "config") syncRaw();
  document.querySelectorAll("nav button[data-view]").forEach(x => x.classList.toggle("active", x === b));
  state.view = b.dataset.view; state.filter = ""; $("#main").innerHTML = ""; render();
});
$("#main").addEventListener("input", e => { if (e.target.id === "filter") { state.filter = e.target.value; render(); } });
$("#main").addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.edit) openEditor(JSON.parse(t.dataset.edit), t.dataset.title);
  if (t.dataset.add) addItem(t.dataset.add);
  if (t.id === "cfg-validate") { if (syncRaw()) validate($("#cfg-msg")); }
  if (t.id === "cfg-apply") { if (syncRaw()) apply($("#cfg-msg")); }
  if (t.id === "cfg-reload") { if (!state.dirty || confirm("Discard the draft and reload from disk?")) loadConfig().then(() => { $("#main").innerHTML = ""; render(); }); }
});
function syncRaw() {
  const el = $("#cfg-text"); if (!el) return true;
  try { const v = JSON.parse(el.value); if (JSON.stringify(v) !== JSON.stringify(state.draft)) { state.draft = v; state.dirty++; } return true; }
  catch (err) { const m = $("#cfg-msg"); if (m) m.innerHTML = `<div class="msg err">Not valid JSON: ${esc(err.message)}</div>`; return false; }
}

const templates = {
  "gw-route": () => ({ ref: ["extensions", "gateway", "routes"], title: "New gateway route", help: "Path supports :param and *wildcard. Set exactly one of cluster, redirect, respond.",
    value: { name: "new-route", path: "/api/:id", methods: ["GET"], cluster: (state.draft.clusters[0] || {}).name || "", rewrite: "/{id}" } }),
  "core-route": () => ({ ref: ["route_configs", 0, "virtual_hosts", 0, "routes"], title: "New core route", help: "Added to the first virtual host of the first route config.",
    value: { match: { prefix: "/new/" }, route: { cluster: (state.draft.clusters[0] || {}).name || "" } } }),
  cluster: () => ({ ref: ["clusters"], title: "New service", help: "lb_policy: least_request, round_robin or random.",
    value: { name: "new-service", lb_policy: "least_request", endpoints: [{ address: "127.0.0.1:9000" }] } }),
  listener: () => ({ ref: ["listeners"], title: "New entrypoint", help: "protocol http (needs route_config) or tcp (needs cluster).",
    value: { name: "new-listener", address: "0.0.0.0:8081", route_config: (state.draft.route_configs[0] || {}).name || "" } }),
  apikey: () => ({ ref: ["extensions", "gateway", "api_keys"], title: "New API key set", help: "Prefer sha256 (hex) over key: printf '%s' KEY | sha256sum",
    value: { name: "keys", header: "X-API-Key", keys: [{ consumer: "client-1", sha256: "" }] } }),
  jwt: () => ({ ref: ["extensions", "gateway", "jwt"], title: "New JWT provider", help: "algorithms is an allow-list; keys from jwks_file, inline jwks, or hs_secret (≥ 32 bytes).",
    value: { name: "idp", algorithms: ["RS256"], issuer: "https://issuer.example/", audiences: ["api"], jwks_file: "/etc/likzik/jwks.json" } }),
  limit: () => ({ ref: ["extensions", "gateway", "rate_limits"], title: "New rate limit", help: "per: second, minute or hour. key: client_ip, consumer, route or header:<name>.",
    value: { name: "limit", requests: 100, per: "second", key: "client_ip" } }),
};
function addItem(kind) {
  if (kind === "gateway") { ensure(state.draft, ["extensions", "gateway"], {}); const g = state.draft.extensions.gateway; g.fallthrough = true; g.routes = g.routes || []; state.dirty++; render(); return; }
  const t = templates[kind]();
  if (t.ref[0] === "extensions") ensure(state.draft, ["extensions", "gateway"], { routes: [] });
  const list = ensure(state.draft, t.ref, []);
  openEditor(null, t.title, { list, value: t.value, help: t.help });
}
let editing = null;
function openEditor(ref, title, add) {
  const v = add ? add.value : getIn(state.draft, ref);
  editing = { ref, add };
  $("#dlg-title").textContent = title; $("#dlg-help").textContent = add ? add.help : "Edit this object; changes go to the draft.";
  $("#dlg-text").value = JSON.stringify(v, null, 2); $("#dlg-msg").innerHTML = "";
  $("#dlg-delete").style.display = ref && typeof ref[ref.length - 1] === "number" ? "" : "none";
  $("#dlg").showModal();
}
$("#dlg-cancel").onclick = () => $("#dlg").close();
$("#dlg-save").onclick = () => {
  let v; try { v = JSON.parse($("#dlg-text").value); } catch (err) { $("#dlg-msg").innerHTML = `<div class="msg err">Not valid JSON: ${esc(err.message)}</div>`; return; }
  if (editing.add) editing.add.list.push(v); else setIn(state.draft, editing.ref, v);
  state.dirty++; $("#dlg").close(); render();
};
$("#dlg-delete").onclick = () => { if (!confirm("Remove this from the draft?")) return; delIn(state.draft, editing.ref); state.dirty++; $("#dlg").close(); render(); };
$("#discard").onclick = () => { if (confirm("Discard all unsaved changes?")) { state.draft = structuredClone(state.loaded); state.dirty = 0; $("#main").innerHTML = ""; render(); } };
$("#review").onclick = () => $('nav button[data-view="config"]').click();
$("#apply").onclick = () => { if (state.view === "config" && !syncRaw()) return; apply(null); };
$("#theme").onclick = () => { const r = document.documentElement; const cur = r.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  r.dataset.theme = cur === "dark" ? "light" : "dark"; try { localStorage.setItem("likzik-theme", r.dataset.theme); } catch {} };
try { const t = localStorage.getItem("likzik-theme"); if (t) document.documentElement.dataset.theme = t; } catch {}

function showMsg(el, ok, text) {
  const html = `<div class="msg ${ok ? "ok" : "err"}">${esc(text)}</div>`;
  if (el) el.innerHTML = html; else { const m = document.createElement("div"); m.innerHTML = html; $("#main").prepend(m); setTimeout(() => m.remove(), 8000); }
}
async function validate(el) {
  const r = await api("/api/validate", { method: "POST", body: JSON.stringify(state.draft, null, 2) });
  const j = await r.json(); showMsg(el, j.ok, j.ok ? "Valid: " + (j.message || "configuration OK") : j.message);
}
async function apply(el) {
  const r = await api("/api/config", { method: "PUT", headers: { "If-Match": state.etag }, body: JSON.stringify(state.draft, null, 2) + "\n" });
  const j = await r.json();
  if (!j.ok) { showMsg(el, false, (r.status === 409 ? "Conflict: " : "Rejected, nothing was written: ") + j.message); return; }
  await loadConfig(); await poll();
  $("#main").innerHTML = ""; render();
  showMsg(el && $("#cfg-msg"), j.applied, j.applied ? `Applied: the proxy is now on generation ${j.generation}.` : j.message);
}

(async () => {
  const r = await api("/api/info"); state.info = await r.json();
  await loadConfig(); render(); await poll(); render();
  setInterval(poll, 2000);
})();
</script>
</body>
</html>
